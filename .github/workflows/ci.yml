# CI: full-coverage verification matrix.
#
# The offline suite runs on every supported CPython (the 3.9 floor through
# 3.13) on every runner platform (Linux, macOS, Windows) — coverage is the
# matrix, not a sample. The lint gate pins the ruff version so a ruff
# release cannot change the gate. The network suite is an explicit opt-in
# job: upstream availability (and the live CMD form job) must never gate
# merges, so it reports but cannot fail.
#
# The offline job's failure diagnostics are permanent, not scaffolding:
# pytest writes a junit report and a full log, a dedicated step re-emits
# every failed test as an error annotation, and both files ride as
# artifacts. Annotations and artifact metadata stay readable through the
# API even where job logs are not (no log-download rights), so this trio
# is the failure observation surface the matrix is debugged through.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned ruff
        run: python -m pip install ruff==0.17.4
      - name: Lint
        run: ruff check .

  test:
    name: offline suite (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          # setup-python ships no 3.9 for ubuntu-latest (26.04); the 3.9
          # floor runs on the 24.04 image, where the interpreter exists
          - os: ubuntu-latest
            python-version: "3.9"
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test extras
        run: python -m pip install -e .[test]
      - name: Offline test suite
        shell: bash
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          set -o pipefail
          python -u -m pytest --junitxml=junit.xml 2>&1 | tee pytest_out.log; code=${PIPESTATUS[0]}
          exit "$code"
      - name: Emit failure diagnostics
        if: failure()
        shell: bash
        run: |
          # a dedicated clean step (no pipelines) — the annotation channel
          # works from steps like this one; the debugging surface is
          # readable through the API without log-download rights
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          if os.path.exists('junit.xml'):
              t = ET.parse('junit.xml').getroot()
              for tc in t.iter('testcase'):
                  f = tc.find('failure')
                  if f is None:
                      f = tc.find('error')
                  if f is not None:
                      msg = (f.get('message') or '')[:1200].replace('\n', ' ~~~ ')
                      print(f"##[error]{tc.get('classname')}.{tc.get('name')}: {msg}")
          PY
          if [ -f pytest_out.log ]; then
            T=$(tail -n 25 pytest_out.log | sed -z 's/\r//g; s/\n/ ~~/g')
            echo "##[error]tail: ${T:0:3800}"
          fi
      - name: Upload test logs (diagnostics)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ matrix.python-version }}-${{ matrix.os }}
          path: |
            pytest_out.log
            junit.xml

  network:
    name: network suite (never gates)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with test extras
        run: python -m pip install -e .[test]
      - name: Catalog URLs and one live CMD form job (explicit opt-in)
        run: python -m pytest -m network -o addopts=""
