[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "stellariso"
version = "0.1.0"
description = "Faithful and unified access to single-star theoretical isochrones."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "astro-jingtao" }]
keywords = [
    "astronomy",
    "astrophysics",
    "isochrones",
    "stellar evolution",
    "MIST",
    "PARSEC",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.24",
    "astropy>=5.3",
    "scipy>=1.10",
    "requests>=2.28",
    "certifi",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/astro-jingtao/stellariso"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"stellariso" = ["skills/**/*"]
"stellariso.registry" = ["*.json"]
"stellariso.models.mist" = ["*.json"]
"stellariso.models.parsec" = ["*.json", "*.crt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: tests that require live internet access (run explicitly with '-m network')",
]
